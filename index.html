<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Modo claro">
    <span>🌙</span><span class="switch-track"></span><span>☀️</span>
  </button>

  <h1 class="game-title" aria-label="Tetris">
    <span style="color:#ba68c8">T</span><span style="color:#81c784">E</span><span style="color:#ffd54f">T</span><span style="color:#e57373">R</span><span style="color:#4dd0e1">I</span><span style="color:#ffb74d">S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- records: formulario de nombre + tabla (solo en game over) -->
        <div id="gameover-records" class="records hidden">
          <p id="records-notice" class="records-notice hidden"></p>
          <form id="name-form" class="name-form hidden" autocomplete="off">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Tu nombre" />
            <button type="submit" id="name-submit">Guardar</button>
          </form>
          <h2 class="records-title">MEJORES PUNTUACIONES</h2>
          <ol class="records-list"></ol>
          <p class="records-stats"></p>
          <button type="button" class="reset-records">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- pantalla de inicio con tabla de records -->
    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records">
          <h2 class="records-title">MEJORES PUNTUACIONES</h2>
          <ol class="records-list"></ol>
          <p class="records-stats"></p>
          <button type="button" class="reset-records">Resetear records</button>
        </div>
        <button id="start-btn" type="button">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
